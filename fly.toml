# Deploys apps/game-server. Run all `fly` commands from the repo root so the
# build context includes the root package.json/package-lock.json needed by
# the npm workspaces setup — see apps/game-server/Dockerfile.
#
# Already launched (app: blunk-game-server). To redeploy after changes:
#   fly deploy
# To update secrets:
#   fly secrets set LIVEKIT_API_KEY=... LIVEKIT_API_SECRET=... WEB_ORIGIN=https://blunk-web.vercel.app
#
# See https://fly.io/docs/reference/configuration/ for full config reference.

app = 'blunk-game-server'
primary_region = 'lhr'

[build]
  dockerfile = 'apps/game-server/Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
